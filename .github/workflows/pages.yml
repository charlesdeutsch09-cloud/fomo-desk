name: pages
on:
  push:
    branches: [main, data]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: site}
      - uses: actions/checkout@v4
        with: {ref: data, path: data}
        continue-on-error: true
      - name: assemble
        run: |
          rm -rf site/.git site/.github site/README.md
          mkdir -p site/d
          if [ -d data/d ]; then cp -r data/d/. site/d/; fi
      - uses: actions/upload-pages-artifact@v3
        with: {path: site, retention-days: 1}
      - id: deployment
        uses: actions/deploy-pages@v4
